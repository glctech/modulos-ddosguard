zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 20db31e5e51343cb8b8d9fdc78f034e3
    name: Templates/Security
  templates:
  - uuid: 61d5a6b1ffdc47caa3899e0571206580
    template: DDoS Guard - Agent
    name: DDoS Guard - Agent
    description: "Template leve para associar em CADA HOST monitorado pelo DDoS Guard.\n\
      Contém apenas os itens trapper que o agente coletor (ddos_guard_agent.py)\n\
      envia via zabbix_sender, mais as triggers essenciais de alerta por host.\n\n\
      NÃO inclui dashboard — o dashboard fica no template principal\n\"DDoS Guard\
      \ - Security Monitoring\" associado ao servidor/appliance.\n\nInstalação:\n\
      \  1. Importe este arquivo em Administration > Templates\n  2. Associe \"DDoS\
      \ Guard - Agent\" em cada host Linux ou Windows\n     que tem o ddos_guard_agent.py\
      \ instalado\n  3. O template principal \"DDoS Guard - Security Monitoring\"\
      \ fica\n     associado APENAS no host que roda o servidor Zabbix/appliance\n\
      \nCompatível com Zabbix 7.4+\nAgente: ddos_guard_agent.py (Linux e Windows)\n"
    groups:
    - name: Templates/Security
    macros:
    - macro: '{$DG.HEARTBEAT.TIMEOUT}'
      value: 15m
      description: Tempo sem heartbeat do agente para considerar o host sem monitoramento
        ativo
    - macro: '{$DG.ATTACK.WARN}'
      value: '50'
      description: Tentativas de ataque/min (janela de 2min) para disparar alerta
        HIGH
    - macro: '{$DG.ATTACK.DISASTER}'
      value: '200'
      description: Tentativas de ataque/min sustentadas por 5min para disparar alerta
        DISASTER (possivel DDoS)
    - macro: '{$DG.DISTINCT_IPS.DISASTER}'
      value: '50'
      description: IPs de origem distintos em 5min para disparar alerta DISASTER
        (ataque distribuido)
    - macro: '{$DG.FIREWALL.WARN}'
      value: '500'
      description: Bloqueios de firewall em 10min para disparar alerta HIGH
    - macro: '{$DG.AV.WARN}'
      value: '1'
      description: Deteccoes de antivirus em 10min para disparar alerta WARNING
        (primeira deteccao)
    - macro: '{$DG.AV.HIGH}'
      value: '5'
      description: Deteccoes de antivirus em 10min para disparar alerta HIGH (multiplas
        deteccoes)
    - macro: '{$DG.AV.DISASTER}'
      value: '20'
      description: Deteccoes de antivirus em 10min para disparar alerta DISASTER
        (possivel surto/infeccao em massa)
    items:
    - uuid: fc05ee02f0d74bd8b0f63ec2e9010b0d
      name: 'DDoS Guard: agent heartbeat'
      type: TRAP
      key: ddosguard.agent.heartbeat
      value_type: UNSIGNED
      history: 7d
      description: 'Enviado pelo agente a cada ciclo (padrão: 10s).

        Valor sempre 1. Usado para detectar se o agente parou.

        '
      tags:
      - tag: component
        value: monitoring
      - tag: source
        value: ddosguard-agent
      triggers:
      - uuid: f75c75bfcd58480886a4174191c9f883
        expression: nodata(/DDoS Guard - Agent/ddosguard.agent.heartbeat,{$DG.HEARTBEAT.TIMEOUT})=1
        name: DDoS Guard Agent parou em {HOST.NAME}
        priority: WARNING
        description: "O agente coletor não envia heartbeat há mais de {$DG.HEARTBEAT.TIMEOUT}.\n\
          Verifique o serviço ddos-guard-agent no host monitorado:\n  Linux:   systemctl\
          \ status ddos-guard-agent\n  Windows: Get-Service DDoSGuardAgent\n"
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: monitoring
      delay: '0'
      trends: 365d
    - uuid: 22bd3dca51f1431a89aab960c9dc6e14
      name: 'DDoS Guard: attacks per minute (counter)'
      type: TRAP
      key: ddosguard.attacks.rate
      value_type: UNSIGNED
      history: 30d
      description: 'Número de tentativas de ataque detectadas no último intervalo

        de agregação (padrão: 60s). Enviado pelo agente via zabbix_sender.

        '
      tags:
      - tag: component
        value: ddos
      - tag: source
        value: ddosguard-agent
      triggers:
      - uuid: 949eb69c4f49420fad45a221254c25f3
        expression: min(/DDoS Guard - Agent/ddosguard.attacks.rate,2m)>={$DG.ATTACK.WARN}
        name: Pico de ataques em {HOST.NAME} (>= {$DG.ATTACK.WARN}/min)
        priority: HIGH
        description: 'Aumento anormal no número de tentativas de ataque detectadas

          pelo agente. Pode ser brute-force, scan ou estágio inicial de DDoS.

          Verifique o dashboard "DDoS Guard - Security Operations Center".

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ddos
      - uuid: 434e14339a654f728cd86c746fe3677e
        expression: min(/DDoS Guard - Agent/ddosguard.attacks.rate,5m)>={$DG.ATTACK.DISASTER}
        name: Possível ataque DDoS em {HOST.NAME} (>= {$DG.ATTACK.DISASTER}/min por
          5min)
        priority: DISASTER
        description: 'Volume sustentado de tentativas de ataque muito acima do normal.

          Padrão consistente com ataque DDoS ou varredura massiva.

          Ação imediata recomendada — verifique o painel de ataques.

          '
        manual_close: 'YES'
        dependencies:
        - name: Pico de ataques em {HOST.NAME} (>= {$DG.ATTACK.WARN}/min)
          expression: min(/DDoS Guard - Agent/ddosguard.attacks.rate,2m)>={$DG.ATTACK.WARN}
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ddos
      delay: '0'
      trends: 365d
    - uuid: 64931273162e4af7bd8eabf2845545fb
      name: 'DDoS Guard: distinct source IPs (last 5 min)'
      type: TRAP
      key: ddosguard.distinct_ips.rate
      value_type: UNSIGNED
      history: 30d
      description: 'Número de IPs de origem distintos observados nos últimos 5 minutos.

        Pico súbito indica ataque DDoS distribuído (botnet).

        '
      tags:
      - tag: component
        value: ddos
      - tag: source
        value: ddosguard-agent
      triggers:
      - uuid: 027af34b95d54618a0a422dc8a90d722
        expression: min(/DDoS Guard - Agent/ddosguard.distinct_ips.rate,5m)>={$DG.DISTINCT_IPS.DISASTER}
        name: Ataque distribuído em {HOST.NAME} — muitas origens distintas (>= {$DG.DISTINCT_IPS.DISASTER}
          IPs)
        priority: DISASTER
        description: 'Grande número de IPs distintos atacando simultaneamente é

          característico de ataque DDoS distribuído (botnet).

          Considere acionar mitigação upstream (scrubbing center / ACL no ISP).

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ddos
      delay: '0'
      trends: 365d
    - uuid: f84d9cc42a8041f3bf5e4af38fcb692a
      name: 'DDoS Guard: firewall blocks per minute (counter)'
      type: TRAP
      key: ddosguard.firewall.rate
      value_type: UNSIGNED
      history: 30d
      description: 'Número de bloqueios de firewall no último intervalo de agregação.

        Fontes: iptables DROP, UFW BLOCK, fail2ban BAN, nftables.

        '
      tags:
      - tag: component
        value: firewall
      - tag: source
        value: ddosguard-agent
      triggers:
      - uuid: e10fc4abd14c471186f82f68556b1c64
        expression: sum(/DDoS Guard - Agent/ddosguard.firewall.rate,10m)>={$DG.FIREWALL.WARN}
        name: Volume alto de bloqueios de firewall em {HOST.NAME} (>= {$DG.FIREWALL.WARN}
          bloqueios/10min)
        priority: HIGH
        description: 'O firewall bloqueou um volume anormalmente alto de conexões
          nos últimos 10 minutos.

          Pode indicar ataque em andamento sendo contido pelo firewall.


          Nota técnica: o agente envia cada bloqueio como um evento individual

          (valor sempre 1), não como uma taxa pré-calculada — por isso a expressão

          soma (sum) os eventos na janela em vez de usar min(), que exigiria que

          TODO valor no período fosse >= limiar e nunca dispararia na prática.

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
        - tag: component
          value: firewall
      delay: '0'
      trends: 365d
    - uuid: c9e5de0ed7df4a1097b67e9a85c1f92d
      name: 'DDoS Guard: antivirus blocks per minute (counter)'
      type: TRAP
      key: ddosguard.antivirus.rate
      value_type: UNSIGNED
      history: 30d
      description: 'Número de detecções/bloqueios do antivírus no último intervalo.

        Fontes: ClamAV (clamd.log), Windows Defender (Event ID 1116/1117).

        '
      tags:
      - tag: component
        value: antivirus
      - tag: source
        value: ddosguard-agent
      triggers:
      - uuid: e795bf87ca37433ea7b5c19b0a20efb6
        expression: sum(/DDoS Guard - Agent/ddosguard.antivirus.rate,10m)>={$DG.AV.WARN}
        name: Antivírus detectou ameaça em {HOST.NAME}
        priority: WARNING
        description: 'O antivírus detectou e agiu sobre uma ameaça no host.

          Primeira detecção — confirme se foi contida (verifique o item

          "raw block event - antivirus" para o nome do malware e a ação tomada).

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
        - tag: component
          value: antivirus
      - uuid: cb5a87217f684d0cac48b88871ae6d34
        expression: sum(/DDoS Guard - Agent/ddosguard.antivirus.rate,10m)>={$DG.AV.HIGH}
        name: Múltiplas detecções de malware em {HOST.NAME} (>= {$DG.AV.HIGH}/10min)
        priority: HIGH
        description: 'O antivírus detectou múltiplas ameaças em curto período.

          Verifique o host imediatamente — possível infecção ativa ou

          tentativa de intrusão via arquivo malicioso.


          Nota técnica: soma (sum) os eventos na janela em vez de usar min(),

          já que cada detecção é enviada como evento individual (valor sempre 1).

          '
        manual_close: 'YES'
        dependencies:
        - name: Antivírus detectou ameaça em {HOST.NAME}
          expression: sum(/DDoS Guard - Agent/ddosguard.antivirus.rate,10m)>={$DG.AV.WARN}
        tags:
        - tag: scope
          value: security
        - tag: component
          value: antivirus
      - uuid: 90933fd5eb314b068d09ca406d59dd10
        expression: sum(/DDoS Guard - Agent/ddosguard.antivirus.rate,10m)>={$DG.AV.DISASTER}
        name: Possível surto de malware em {HOST.NAME} (>= {$DG.AV.DISASTER}/10min)
        priority: DISASTER
        description: 'Volume muito alto de detecções de antivírus no mesmo host

          em curto período — padrão consistente com infecção ativa se espalhando

          (worm, ransomware em execução) em vez de um arquivo isolado.

          Ação imediata: isole o host da rede e acione a resposta a incidentes.

          '
        manual_close: 'YES'
        dependencies:
        - name: Múltiplas detecções de malware em {HOST.NAME} (>= {$DG.AV.HIGH}/10min)
          expression: sum(/DDoS Guard - Agent/ddosguard.antivirus.rate,10m)>={$DG.AV.HIGH}
        tags:
        - tag: scope
          value: security
        - tag: component
          value: antivirus
      - uuid: 6cea379a57e8426e824e44b33f8c6515
        expression: sum(/DDoS Guard - Agent/ddosguard.firewall.rate,15m)>0 and sum(/DDoS
          Guard - Agent/ddosguard.antivirus.rate,15m)>0
        name: Firewall e antivírus ativos simultaneamente em {HOST.NAME}
        priority: HIGH
        description: 'O mesmo host teve bloqueios de firewall E detecções de antivírus

          nos últimos 15 minutos — sinal mais forte de comprometimento ativo do

          que qualquer um dos dois isoladamente (ex.: um invasor explorando o

          host via rede e deixando um artefato malicioso no disco).


          Janela de 15min (mais ampla que os 10min das triggers individuais) para

          capturar eventos de ferramentas diferentes que não chegam exatamente

          no mesmo instante.

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
        - tag: component
          value: antivirus
      delay: '0'
      trends: 365d
    - uuid: 3bd484b8ec6749e996026063807bbc06
      name: 'DDoS Guard: raw attack event (JSON)'
      type: TRAP
      key: ddosguard.attack.event
      value_type: TEXT
      history: 7d
      description: 'Evento JSON completo de cada ataque detectado pelo agente.

        Consumido pelos widgets do dashboard para exibir detalhes do ataque.

        Formato: {"src_ip":"x.x.x.x","country":"BR","attack_type":"SYN_FLOOD",

        "attempts":150,"target_port":80,"protocol":"TCP","blocked":true,...}

        '
      tags:
      - tag: component
        value: ddos
      - tag: source
        value: ddosguard-agent
      delay: '0'
      trends: '0'
    - uuid: 69bfde43fbe14a599243edb8ee92f319
      name: 'DDoS Guard: raw block event - firewall (JSON)'
      type: TRAP
      key: ddosguard.block.firewall
      value_type: TEXT
      history: 7d
      description: 'Evento JSON de cada bloqueio de firewall.

        Formato: {"src_ip":"x.x.x.x","country":"RU","tool":"iptables",

        "rule":"INPUT DROP","target_port":22,"protocol":"TCP",...}

        '
      tags:
      - tag: component
        value: firewall
      - tag: source
        value: ddosguard-agent
      delay: '0'
      trends: '0'
    - uuid: aecf462b08f14b818c598cf20f0761e4
      name: 'DDoS Guard: raw block event - antivirus (JSON)'
      type: TRAP
      key: ddosguard.block.antivirus
      value_type: TEXT
      history: 7d
      description: 'Evento JSON de cada detecção do antivírus.

        Formato: {"src_ip":"127.0.0.1","tool":"clamav",

        "malware":"Eicar-Signature","action":"quarantined","file":"/tmp/x",...}

        '
      tags:
      - tag: component
        value: antivirus
      - tag: source
        value: ddosguard-agent
      delay: '0'
      trends: '0'
