zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 05e860e978584c429d482a80eea9d0a3
    name: Templates/Network devices
  - uuid: 72e7158edd5644e7b4ee3d273658a95d
    name: Templates/Security
  templates:
  - uuid: 1c0d3922492342a0902dc0994a278447
    template: DDoS Guard - Sophos Security
    name: DDoS Guard - Sophos Security
    description: "Template de segurança DDoS Guard para Sophos XG/XGS Firewall,\n\
      Sophos Central e Sophos Intercept X.\n\nRecebe eventos via syslog (formato SFOS\
      \ ou CEF) e detecta:\nbloqueios de firewall, intrusões IPS, malware (AV), ameaças\
      \ ATP\n(C2/botnet), web filter e brute-force.\n\nCONFIGURAÇÃO NO SOPHOS XG/XGS\
      \ (via interface web):\n  System > Administration > Notification Settings\n\
      \  > Log Settings > Syslog Server > Add\n    Name:     DDoS Guard\n    IP: \
      \      IP_DO_APPLIANCE_ZABBIX\n    Port:     514\n    Facility: LOCAL0\n   \
      \ Format:   Device Standard Format (SFOS)\n  > Severity: Information\n  > Log\
      \ Types: ✅ Firewall ✅ IPS ✅ Anti-Virus ✅ ATP ✅ Web Filter\n\nCONFIGURAÇÃO VIA\
      \ CLI (SFOS):\n  system syslog add name \"DDoSGuard\" ipaddress IP_ZABBIX port\
      \ 514\n  system syslog update name \"DDoSGuard\" logcomponent all\n  system\
      \ syslog enable\n\nCONFIGURAÇÃO CEF (alternativa):\n  System > Administration\
      \ > Notification Settings\n  > Log Settings > Syslog Server\n    Format: Common\
      \ Event Format (CEF)\n\nSOPHOS CENTRAL / INTERCEPT X:\n  O Sophos Central não\
      \ envia syslog nativo.\n  Opções:\n  1. Instale o Sophos Syslog Forwarder no\
      \ servidor Windows\n  2. Use a API do Sophos Central + syslog_forwarder.py\n\
      \  3. Configure o XG como proxy de logs do Central\n\nCompatível com: SFOS 18.0+\
      \ / 19.0+ / 20.0+\n"
    groups:
    - name: Templates/Network devices
    - name: Templates/Security
    macros:
    - macro: '{$SOPHOS.FW.BLOCK.WARN}'
      value: '100'
      description: Bloqueios de firewall/min para trigger WARNING
    - macro: '{$SOPHOS.FW.BLOCK.HIGH}'
      value: '1000'
      description: Bloqueios de firewall/min para trigger HIGH (DDoS)
    - macro: '{$SOPHOS.IPS.WARN}'
      value: '50'
      description: Detecções IPS/min para trigger WARNING
    - macro: '{$SOPHOS.IPS.HIGH}'
      value: '500'
      description: Detecções IPS/min para trigger HIGH
    - macro: '{$SOPHOS.AV.WARN}'
      value: '5'
      description: Detecções de malware em 10min para trigger HIGH
    - macro: '{$SOPHOS.ATP.THRESHOLD}'
      value: '1'
      description: Qualquer detecção ATP dispara trigger DISASTER
    - macro: '{$SOPHOS.HEARTBEAT.TIMEOUT}'
      value: 30m
      description: Tempo sem syslog para trigger WARNING
    items:
    - uuid: 82d89e86d0f5476789f991c1ad32e2dc
      name: 'DDoS Guard: Sophos firewall blocks per minute'
      type: TRAP
      key: ddosguard.firewall.rate
      value_type: UNSIGNED
      units: /min
      history: 30d
      description: 'Bloqueios de firewall por minuto recebidos via syslog do Sophos
        XG/XGS.

        Populado pelo sophos_receiver.php quando detecta log_type=Firewall

        com status=Deny/Drop no formato SFOS.

        '
      tags:
      - tag: component
        value: firewall
      - tag: source
        value: sophos
      triggers:
      - uuid: 4c56cb395f154791b36d653c54c15920
        expression: sum(/DDoS Guard - Sophos Security/ddosguard.firewall.rate,5m)>={$SOPHOS.FW.BLOCK.HIGH}
        name: 'Sophos: Volume crítico de bloqueios em {HOST.NAME} (>={$SOPHOS.FW.BLOCK.HIGH}/min)'
        priority: HIGH
        description: 'O Sophos XG está bloqueando um volume crítico de conexões.

          Padrão típico de ataque DDoS ou varredura massiva.

          Verifique: Monitor > Log Viewer > Firewall

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
      - uuid: fbcad26ff73149369a4bbde175098bae
        expression: sum(/DDoS Guard - Sophos Security/ddosguard.firewall.rate,5m)>={$SOPHOS.FW.BLOCK.WARN}
        name: 'Sophos: Alto volume de bloqueios em {HOST.NAME} (>={$SOPHOS.FW.BLOCK.WARN}/min)'
        priority: WARNING
        manual_close: 'YES'
        dependencies:
        - name: 'Sophos: Volume crítico de bloqueios em {HOST.NAME} (>={$SOPHOS.FW.BLOCK.HIGH}/min)'
          expression: sum(/DDoS Guard - Sophos Security/ddosguard.firewall.rate,5m)>={$SOPHOS.FW.BLOCK.HIGH}
        tags:
        - tag: scope
          value: security
      delay: '0'
      trends: 365d
    - uuid: 688f0cf9b2fe457ea504b7b507703165
      name: 'DDoS Guard: Sophos block event (JSON)'
      type: TRAP
      key: ddosguard.block.firewall
      value_type: TEXT
      history: 7d
      description: 'Evento JSON do último bloqueio de firewall Sophos.

        Inclui: src_ip, country, tool, target_port, protocol,

        log_type, log_subtype (SFOS fields).

        '
      tags:
      - tag: component
        value: firewall
      - tag: source
        value: sophos
      delay: '0'
      trends: '0'
    - uuid: cc064a64bbb64e199053bcfc3f024150
      name: 'DDoS Guard: Sophos IPS detections per minute'
      type: TRAP
      key: ddosguard.attacks.rate
      value_type: UNSIGNED
      units: /min
      history: 30d
      description: 'Detecções do IPS Sophos por minuto.

        Inclui: SQL Injection, Port Scan, SYN Flood, Web Attacks

        e outras assinaturas IPS do SFOS.

        '
      tags:
      - tag: component
        value: ips
      - tag: source
        value: sophos
      triggers:
      - uuid: d81405d2d19846caaf425005149b5bc9
        expression: sum(/DDoS Guard - Sophos Security/ddosguard.attacks.rate,5m)>={$SOPHOS.IPS.HIGH}
        name: 'Sophos: Volume crítico de detecções IPS em {HOST.NAME}'
        priority: HIGH
        description: 'O IPS do Sophos está detectando um volume crítico de intrusões.

          Verifique: Monitor > Log Viewer > IPS

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
      - uuid: d6d4b69d02fd4293a6330279d5bde01d
        expression: sum(/DDoS Guard - Sophos Security/ddosguard.attacks.rate,5m)>={$SOPHOS.IPS.WARN}
        name: 'Sophos: Pico de detecções IPS em {HOST.NAME}'
        priority: WARNING
        manual_close: 'YES'
        dependencies:
        - name: 'Sophos: Volume crítico de detecções IPS em {HOST.NAME}'
          expression: sum(/DDoS Guard - Sophos Security/ddosguard.attacks.rate,5m)>={$SOPHOS.IPS.HIGH}
        tags:
        - tag: scope
          value: security
      delay: '0'
      trends: 365d
    - uuid: 90315ba3e0cf4d018f13f679d7838531
      name: 'DDoS Guard: Sophos attack event (JSON)'
      type: TRAP
      key: ddosguard.attack.event
      value_type: TEXT
      history: 7d
      description: 'Evento JSON do último ataque detectado pelo Sophos IPS/Web Filter.

        Inclui: src_ip, country, attack_type, target_port, protocol,

        severity, mitre_tactic, mitre_tech, message (descrição da assinatura).

        '
      tags:
      - tag: component
        value: ddos
      - tag: source
        value: sophos
      delay: '0'
      trends: '0'
    - uuid: 756638dacaa04c5698097af41ab9e645
      name: 'DDoS Guard: Sophos AV blocks per minute'
      type: TRAP
      key: ddosguard.antivirus.rate
      value_type: UNSIGNED
      units: /min
      history: 30d
      description: 'Detecções de malware pelo Sophos Anti-Virus por minuto.

        Inclui vírus, trojans, ransomware e PUAs bloqueados

        no tráfego web/email pelo Sophos XG.

        '
      tags:
      - tag: component
        value: antivirus
      - tag: source
        value: sophos
      triggers:
      - uuid: 42d99300076247589d336999a29341f1
        expression: sum(/DDoS Guard - Sophos Security/ddosguard.antivirus.rate,10m)>={$SOPHOS.AV.WARN}
        name: 'Sophos: Malware detectado em {HOST.NAME} ({$SOPHOS.AV.WARN}+ detecções
          em 10min)'
        priority: HIGH
        description: 'O Sophos AV detectou múltiplas ameaças em curto período.

          Pode indicar infecção ativa ou campanha de malware na rede.

          Verifique: Monitor > Log Viewer > Anti-Virus

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
      delay: '0'
      trends: 365d
    - uuid: f942165cdb6c436fa988163f2ec20e89
      name: 'DDoS Guard: Sophos AV block event (JSON)'
      type: TRAP
      key: ddosguard.block.antivirus
      value_type: TEXT
      history: 7d
      description: 'Evento JSON da última detecção de malware pelo Sophos AV.

        Inclui: src_ip, tool=sophos-av, category=MALWARE,

        message (nome do vírus/trojan), mitre=T1204.

        '
      tags:
      - tag: component
        value: antivirus
      - tag: source
        value: sophos
      delay: '0'
      trends: '0'
    - uuid: 6c3f3df86fe34a989d3ed08b885d70ad
      name: 'DDoS Guard: Sophos ATP event (JSON)'
      type: TRAP
      key: ddosguard.sophos.atp
      value_type: TEXT
      history: 7d
      description: 'Evento do Advanced Threat Protection (ATP) do Sophos XG.

        Detecta comunicação C2 (command & control), botnets e

        tráfego para IPs/domínios maliciosos conhecidos.

        MITRE ATT&CK: T1071 (Command and Control)

        '
      tags:
      - tag: component
        value: ddos
      - tag: source
        value: sophos
      triggers:
      - uuid: 97a65c38493b462abca8bd5ac11a7f87
        expression: nodata(/DDoS Guard - Sophos Security/ddosguard.sophos.atp,1m)=0
        name: 'Sophos ATP: Comunicação C2/botnet detectada em {HOST.NAME}'
        priority: DISASTER
        description: "O Sophos ATP detectou comunicação com servidor C2 (Command &\
          \ Control).\nIsso indica comprometimento ativo de um dispositivo na rede.\n\
          \nAÇÃO IMEDIATA:\n  1. Identifique o dispositivo de origem: Monitor > Log\
          \ Viewer > ATP\n  2. Isole o dispositivo da rede imediatamente\n  3. Execute\
          \ varredura completa com Sophos Intercept X\n  4. Verifique outros dispositivos\
          \ na mesma sub-rede\n  5. Reporte o incidente seguindo o plano de resposta\n\
          \nMITRE ATT&CK: T1071 — Command and Control\n"
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
      delay: '0'
      trends: '0'
    - uuid: 0e5faddb7e3b49e580dc6275605630c2
      name: 'DDoS Guard: Sophos syslog heartbeat'
      type: TRAP
      key: ddosguard.agent.heartbeat
      value_type: UNSIGNED
      history: 7d
      description: 'Heartbeat do pipeline syslog Sophos → DDoS Guard.

        Confirma que o Sophos XG está enviando logs e que o

        sophos_receiver.php está processando corretamente.

        '
      tags:
      - tag: component
        value: monitoring
      - tag: source
        value: sophos
      triggers:
      - uuid: ee4d4bb7aafc4c7cb148805a465c568a
        expression: nodata(/DDoS Guard - Sophos Security/ddosguard.agent.heartbeat,{$SOPHOS.HEARTBEAT.TIMEOUT})=1
        name: 'Sophos: Pipeline syslog parou em {HOST.NAME}'
        priority: WARNING
        description: "O Sophos XG não envia logs há mais de {$SOPHOS.HEARTBEAT.TIMEOUT}.\n\
          Verifique:\n  1. Configuração syslog no Sophos XG:\n     System > Administration\
          \ > Notification Settings\n  2. rsyslog no appliance: systemctl status rsyslog\n\
          \  3. Porta 514 UDP: ss -ulnp | grep 514\n  4. Arquivo de log: tail /var/log/ddosguard-syslog.log\n"
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
      delay: '0'
      trends: 365d
    - uuid: e9eb6366ef214de8a2a69af1c8665fc5
      name: 'DDoS Guard: distinct source IPs (last 5 min)'
      type: TRAP
      key: ddosguard.distinct_ips.rate
      value_type: UNSIGNED
      history: 30d
      description: 'Número de IPs de origem distintos nos últimos 5 minutos.

        Pico súbito indica ataque DDoS distribuído (botnet).

        '
      tags:
      - tag: component
        value: ddos
      - tag: source
        value: sophos
      triggers:
      - uuid: 4a5bde6f968845b5b2a5b8eca8b18b8a
        expression: min(/DDoS Guard - Sophos Security/ddosguard.distinct_ips.rate,5m)>=30
        name: 'Sophos: Ataque distribuído detectado em {HOST.NAME} (>=30 IPs distintos)'
        priority: HIGH
        description: 'Muitos IPs distintos atacando simultaneamente via Sophos.

          Padrão típico de botnet / DDoS distribuído.

          '
        manual_close: 'YES'
        tags:
        - tag: scope
          value: security
      delay: '0'
      trends: 365d
