# =====================================================================
# DDoS Guard - Receiver syslog unificado (v2.0)
# Destino: /etc/rsyslog.d/ddosguard-syslog.conf
#
# Recebe logs de pfSense, FortiGate e MikroTik RouterOS.
#
# IMPORTANTE: este DEVE ser o unico arquivo em /etc/rsyslog.d/ que
# carrega o modulo imudp e define o ruleset "ddosguard". Ter dois
# arquivos declarando o mesmo modulo/ruleset faz o rsyslog abortar o
# bloco com erro e seguir rodando em silencio.
#
# Verifique com:
#   grep -rn "imudp" /etc/rsyslog.conf /etc/rsyslog.d/
# =====================================================================

module(load="imudp")
module(load="omprog")

# ---------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------
# CRITICO: o omprog EXIGE que a mensagem termine em \n. Templates
# nativos como RSYSLOG_TraditionalForwardFormat nao incluem a quebra de
# linha e fazem o rsyslog rejeitar 100% das mensagens com:
#   "messages must be terminated with \n at end of message"
template(name="DGProgFmt" type="string"
  string="%TIMESTAMP% %FROMHOST-IP% %syslogtag%%msg%\n")

template(name="MikrotikFmt" type="string"
  string="%TIMESTAMP:::date-rfc3339% %FROMHOST-IP% %syslogseverity-text% %msg%\n")

# ---------------------------------------------------------------------
# Listener
# ---------------------------------------------------------------------
input(type="imudp" port="514" ruleset="ddosguard")

# ---------------------------------------------------------------------
# Ruleset
# ---------------------------------------------------------------------
# Nota: como o input esta vinculado ao ruleset "ddosguard", estas
# mensagens NAO passam pelo ruleset padrao. Qualquer action adicional
# precisa ser declarada aqui dentro.
ruleset(name="ddosguard") {

    # 1) Pipeline PHP -> banco -> zabbix_sender
    action(type="omprog"
        name="ddosguard_php"
        binary="/usr/bin/php /usr/share/zabbix/ui/ddosguard/integrations/syslog_receiver.php"
        template="DGProgFmt"
        output="/var/log/ddosguard-omprog.log"
        queue.type="linkedList"
        queue.size="10000"
        queue.discardMark="9000"
        queue.discardSeverity="7"
        action.resumeRetryCount="-1")

    # 2) Log bruto de tudo que chega (auditoria)
    action(type="omfile"
        file="/var/log/ddosguard-syslog.log"
        template="RSYSLOG_TraditionalForwardFormat"
        queue.type="linkedList"
        queue.size="10000")

    # 3) Arquivo dedicado ao CCR1009 (para itens logrt[] e debug)
    #    AJUSTE o IP de origem conforme a interface de saida do seu CCR.
    #    Descubra com: tcpdump -n -i any udp port 514
    if ($fromhost-ip == "45.70.216.69") then {
        action(type="omfile"
            file="/var/log/mikrotik/ccr1009.log"
            template="MikrotikFmt")
    }

    # Impede que essas mensagens tambem caiam em /var/log/syslog
    stop
}
